server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    client_max_body_size 76m;
    client_body_timeout 360s;

    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location = /docs { proxy_pass $backend_upstream$request_uri; }
    location = /openapi.json { proxy_pass $backend_upstream$request_uri; }
    location / { try_files $uri $uri/ /index.html; }
}
