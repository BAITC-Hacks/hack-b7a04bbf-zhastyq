[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-graph"
version = "0.1.0"
description = "Backend проекта Граф денег"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=15",
  "networkx==3.4.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.18",
  "httpx>=0.27,<1",
]

[project.scripts]
money-graph = "money_graph.bootstrap:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"
norecursedirs = [".git", ".venv", ".tmp", "data", "out", "dist", "build"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
